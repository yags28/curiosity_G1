# Local ROBUST retrain — Task 1, for sim-to-sim (MuJoCo) transfer.
# Closed-loop obs (115-dim, set by DistantTargetEnv) + DRND curiosity +
# action-smoothness penalties to kill the bang-bang ballistic motion that
# overfit PhysX (diagnosed 2026-06-14: feet leave ground in 2 steps, stick
# pushed away from target in MuJoCo).
#
# Usage:
#   python launch.py --config configs/local_robust.yaml --no-wandb \
#       --run-name distant_target__drnd_robust
# Output dir: checkpoints/distant_target__drnd_robust/  (preserves old teacher)

wandb:
  project: CDL-HumanoidToolUse
  entity: ydawanka-purdue-university

seed: 42
task: distant_target
run_name: distant_target__drnd_robust

env:
  num_envs: 32
  episode_length: 1000
  device: cuda
  headless: true
  physics_dt: 0.005
  control_dt: 0.02
  randomise:
    position_range: 0.30
    mass_range: 0.30
    friction_range: 0.50
    num_distractors: [1, 3]

curiosity:
  method: drnd
  rnd:
    output_dim: 64
    hidden_dim: 256
    lr: 1.0e-4
    normalize_rewards: true
  drnd:
    n_ensemble: 5
    output_dim: 64
    hidden_dim: 256
    lr: 1.0e-4
    normalize_rewards: true
  rdd:
    sigma: 1.0
    output_dim: 64
    hidden_dim: 256
    lr: 1.0e-4
    normalize_rewards: true

ppo:
  num_steps: 24
  num_minibatches: 4
  update_epochs: 5
  lr: 3.0e-4
  anneal_lr: true
  gamma_int: 0.999
  gamma_ext: 0.990
  gae_lambda: 0.95
  clip_coef: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 1.0
  use_privileged_obs: true

reward:
  alpha_start: 1.0
  alpha_end: 0.1
  alpha_anneal_steps: 5_000_000
  extrinsic_weight: 1.0
  time_penalty: -0.001
  # Action smoothness (anti-bang-bang) — moderate pressure: at |a|≈1 these
  # cost ~0.01-0.02/step vs +1.0 one-time success, so they reshape toward a
  # smooth reach without preventing the task from being learned.
  action_rate_penalty: 0.02
  action_mag_penalty: 0.01

training:
  total_timesteps: 10_000_000
  checkpoint_interval: 100_000
  log_interval: 10
  checkpoint_dir: checkpoints/
  video_dir: videos/
  resume_checkpoint: null
